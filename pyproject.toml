[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aset-seed"
version = "0.1.12"
description = "ASET Seed specification and bounded production runtime"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
aset-seed = "aset_seed.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aset_seed = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/aset_seed/core.py" = ["E", "I", "UP", "B"]
