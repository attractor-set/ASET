CONSTANTS
  ResolutionIds = {r1, r2}
  Bindings = {b1, b2}
  Authorities = {a1, a2}
  TerminalCommitments = {c1, c2}
  RecognizedTerminalCommitments = {c1, c2}
  NoCommitment = noCommitment
  RecognizedAuthorityBindings <- TLC_RecognizedAuthorityBindings

SPECIFICATION Spec
INVARIANTS
  TypeOK
  ResolutionDomain
  AllowSoundness
  FailClosed
  TerminalBindingDerived
  RequestAuthorityRecognized
  TerminalAuthorityRecognized
  AcceptedTerminalUnique
  ConflictSound
  FreshReconsideration
PROPERTIES
  RequestsAppendOnly
  TerminalRecordsImmutable
  SeedStateChangesOnlyByRecognizedTransition
  ConflictObservationPreservesSeedState
CHECK_DEADLOCK FALSE
