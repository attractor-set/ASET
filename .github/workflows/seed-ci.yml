
name: ASET Seed semantic CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check generated language editions
        run: python tools/generate_editions.py --check

      - name: Validate semantic repository
        run: python tools/validate_repository.py

      - name: Verify expanded rc11 identity
        run: python tools/materialize_rc11.py --check

      - name: Run tests
        run: python -m pytest -q

      - name: Static Python checks
        run: python -m ruff check tools tests

      - name: Build deterministic repository snapshot
        run: python tools/build_release.py

      - name: Run independent black-box documentation audit
        run: >-
          python tools/blackbox_documentation_audit.py
          dist/ASET-Repository-Snapshot.zip
          --output-json dist/blackbox-documentation-audit.json
          --output-md dist/blackbox-documentation-audit.md

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: aset-repository-assurance
          if-no-files-found: error
          path: |
            dist/ASET-Repository-Snapshot.zip
            dist/ASET-Repository-Snapshot.zip.sha256
            dist/blackbox-documentation-audit.json
            dist/blackbox-documentation-audit.md
            dist/blackbox-adversarial-results.json
