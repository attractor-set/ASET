name: ASET candidate canon CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Check generated views and language policy
        run: |
          python tools/generate_repository_views.py --check
          python tools/check_language.py
      - name: Validate candidate canon package
        run: |
          python tools/validate_seed_canon.py
          python tools/build_canon_package.py --check
          python tools/validate_canon_package.py
          python tools/validate_ecosystem_registry.py
      - name: Run bounded model and traceability checks
        run: |
          python tools/model_check_seed.py --output dist/seed-model-check.json
          python tools/check_assurance_traceability.py --model-report dist/seed-model-check.json
      - name: Run specification tests and static analysis
        run: |
          python -m pytest -q
          python -m ruff check tools tests
          python tools/static_python_sanity.py
      - name: Audit active documentation claims
        run: python tools/blackbox_documentation_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aset-candidate-canon-ci
          if-no-files-found: warn
          path: |
            dist/seed-model-check.json
            dist/assurance-traceability.json
            dist/blackbox-documentation-audit.json
