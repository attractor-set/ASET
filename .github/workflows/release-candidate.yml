name: ASET release and compatibility gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Resolve approved canon reference
        id: approved
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          fi
      - name: Run approved-to-candidate compatibility and release gate
        env:
          ASET_APPROVED_REF: ${{ steps.approved.outputs.ref }}
        run: python tools/repository_release_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aset-release-compatibility-evidence
          if-no-files-found: warn
          path: |
            dist/canon-compatibility.json
            dist/seed-model-check.json
            dist/assurance-traceability.json
            dist/blackbox-documentation-audit.json
            dist/repository-release-gate.json
