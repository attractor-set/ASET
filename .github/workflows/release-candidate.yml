
name: ASET Seed release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "seed-v*"

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run production repository gate
        run: python tools/production_gate.py

      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: aset-seed-release-candidate
          if-no-files-found: error
          path: |
            dist/ASET-Repository-Snapshot.zip
            dist/ASET-Repository-Snapshot.zip.sha256
            dist/blackbox-documentation-audit.json
            dist/blackbox-documentation-audit.md
            dist/blackbox-adversarial-results.json
            dist/production-gate.json

# A signed GitHub Release is intentionally not created automatically.
# Owner approval and independent release audit remain separate gates.
