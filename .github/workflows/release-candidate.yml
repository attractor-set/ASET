name: ASET release and compatibility gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: python -m pip install -r requirements-ci.txt

      - name: Resolve approved canon reference
        id: approved
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $RUNNER_TEMP/tla2tools.jar" | sha1sum --check
          echo "TLA2TOOLS_JAR=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Download pinned TLAPM
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz"
          unpack="$RUNNER_TEMP/tlapm-unpacked"
          curl --fail --location --retry 3 --output "$archive" https://github.com/tlaplus/tlapm/releases/download/1.6.0-pre/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz
          echo "bfa5e5350ac1ec7202feecad0a4a71a5bb58c16a49660448b35b6f371ba9e2f5  $archive" | sha256sum --check
          mkdir -p "$unpack"
          tar -xzf "$archive" -C "$unpack"
          tlapm_bin="$(find "$unpack" -type f -path '*/bin/tlapm' -print -quit)"
          test -n "$tlapm_bin"
          test -x "$tlapm_bin"
          test "$("$tlapm_bin" --version)" = "4600b24"
          echo "TLAPM_BIN=$tlapm_bin" >> "$GITHUB_ENV"

      - name: Run approved-to-candidate compatibility and release gate
        timeout-minutes: 30
        env:
          ASET_APPROVED_REF: ${{ steps.approved.outputs.ref }}
        run: python tools/repository_release_gate.py

      - name: Verify deterministic INPI deposit generation
        run: |
          python tools/build_inpi_software_deposit.py \
            --ref HEAD \
            --output-dir dist/inpi-deposit-ci \
            --verify-determinism
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aset-release-compatibility-evidence
          if-no-files-found: warn
          path: |
            dist/canon-compatibility.json
            dist/seed-model-check.json
            dist/assurance-traceability.json
            dist/proof-traceability-check.json
            dist/canon-tla-refinement-check.json
            dist/blackbox-documentation-audit.json
            dist/repository-release-gate.json
            dist/tlc-model-check.json
            dist/tlaps-proof.json
            dist/canon-tla-refinement-proof.json
            dist/inpi-deposit-ci/**
            dist/seed-conformance-kit/**
