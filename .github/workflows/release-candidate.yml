name: ASET Seed release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "seed-v*"

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements-ci.txt

      - run: python tools/generate_editions.py --check

      - run: python tools/validate_repository.py

      - run: python -m pytest -q

      - run: python tools/build_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: aset-seed-release-candidate
          path: |
            dist/ASET-Repository-Snapshot.zip
            dist/ASET-Repository-Snapshot.zip.sha256

# A signed GitHub Release is intentionally not created automatically.
# Owner approval and independent audit remain separate release gates.
