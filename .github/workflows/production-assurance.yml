
name: ASET documentation production assurance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-assurance:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run production repository gate
        run: python tools/production_gate.py

      - name: Upload black-box evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aset-documentation-production-assurance
          if-no-files-found: error
          path: |
            dist/ASET-Repository-Snapshot.zip
            dist/ASET-Repository-Snapshot.zip.sha256
            dist/blackbox-documentation-audit.json
            dist/blackbox-documentation-audit.md
            dist/blackbox-adversarial-results.json
            dist/production-gate.json
