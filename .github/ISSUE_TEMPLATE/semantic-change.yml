name: Semantic change proposal
description: Propose a normative change to ASET Seed
title: "[SEED PROPOSAL] "
labels:
  - specification
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the problem without proposing a solution.
    validations:
      required: true

  - type: textarea
    id: semantics
    attributes:
      label: Proposed machine-readable semantics
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: Affected invariants and transitions
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Required conformance and adversarial evidence
    validations:
      required: true
